
services:
  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hypervision
      POSTGRES_PASSWORD: password
      POSTGRES_DB: hypervision
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hypervision"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API ───────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false          # start without .env; values below are used as defaults
    environment:
      APP_NAME: HyperVision
      APP_ENV: production
      APP_SECRET_KEY: change-me-to-a-secure-random-256-bit-key
      APP_DEBUG: "false"
      APP_PORT: "8000"
      DATABASE_URL: postgresql+asyncpg://hypervision:password@postgres:5432/hypervision
      REDIS_URL: redis://redis:6379/0
      REDIS_TTL_SECONDS: "30"
      REDIS_VM_POLL_INTERVAL: "15"
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: "480"
      HYPERV_HOSTS: ""
      HYPERV_USERNAME: ""
      HYPERV_PASSWORD: ""
      CORS_ORIGINS: "http://localhost:5173"
      BOOTSTRAP_ADMIN_EMAIL: admin@corp.local
      BOOTSTRAP_ADMIN_PASSWORD: ChangeMe@123
      BOOTSTRAP_ADMIN_NAME: Admin
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4 --loop uvloop --http httptools"

  # ── Frontend ──────────────────────────────────────────────────────────────
  ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
